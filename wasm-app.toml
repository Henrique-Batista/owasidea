[app]
name = "owasidea"
version = "0.1.0"
identifier = "dev.owasidea.app"

[host]
addr = "127.0.0.1:8787"

# Tauri updater (RL-02). See docs/UPDATER.md. Uncomment to generate
# latest.json from signed bundle artifacts; the private key never goes here.
# [updater]
# channel = "stable"            # or "beta"; OWASIDEA_UPDATE_CHANNEL overrides
# endpoint = "https://releases.example.com/{{channel}}/latest.json"
# pubkey = "keys/owasidea-updater.pub"

[plugins.notes]
path = "plugins/notes"
language = "rust"
type = "library"
kv = "notes:read-write"

[plugins.chat-go]
path = "plugins/chat-go"
language = "go"
type = "executable"

[plugins.attr-example]
path = "plugins/attr-example"
language = "rust"
type = "library"
kv = "attr-example:read-write"

[plugins.example]
path = "plugins/example"
language = "rust"
type = "library"
kv = "example:read-write"

[plugins.attr-ts]
path = "plugins/attr-ts"
language = "typescript"
type = "library"

[plugins.attr-go]
path = "plugins/attr-go"
language = "go"
type = "library"
kv = "attr-go:read-write"

[plugins.tester]
path = "plugins/tester"
language = "csharp"
type = "library"

[plugins.heartbeat]
path = "plugins/heartbeat"
language = "rust"
type = "service"

[dev]
watch = true
hot_reload = true
