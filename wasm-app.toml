[app]
name = "owasidea"
version = "0.1.0"
identifier = "dev.owasidea.app"

[host]
addr = "127.0.0.1:0"

[plugins.notes]
path = "plugins/notes"
language = "rust"
type = "library"

[plugins.chat-go]
path = "plugins/chat-go"
language = "go"
type = "executable"

[plugins.example]
path = "plugins/example"
language = "rust"
type = "library"
kv = "example:read-write"

[dev]
watch = true
hot_reload = true