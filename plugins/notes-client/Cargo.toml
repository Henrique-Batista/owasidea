[workspace]

[package]
name = "notes-client"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.41"

[package.metadata.component]
package = "poc:notes-client"
[package.metadata.component.target]
path = "wit"
world = "notes-client"

[package.metadata.component.target.dependencies]
"poc:notes" = { path = "wit/deps/notes" }
"poc:host" = { path = "wit/deps/host" }
