[package]
name = "owasidea-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI for the Owasidea WASM app framework"
repository = "https://github.com/owasidea/owasidea"
homepage = "https://github.com/owasidea/owasidea"
categories = ["command-line-utilities", "development-tools"]
keywords = ["wasm", "wasmtime", "component-model", "plugins"]

[[bin]]
name = "owasidea"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
owasidea-host = { path = "../host" }
console = "0.15"
toml = "0.8"
regex = "1"
syn = { version = "2", features = ["full"] }
sha2 = "0.10"
semver = "1"
ring = "0.17"
base64 = "0.22"
pathdiff = "0.2"
dialoguer = "0.11"
ratatui = "0.30"
reqwest = { version = "0.12", features = ["json", "blocking", "stream"] }
futures-util = "0.3"
schemars = "0.8"
time = { version = "0.3", features = ["formatting", "parsing"] }
url = "2"

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
proptest = "1"
tempfile = "3"
