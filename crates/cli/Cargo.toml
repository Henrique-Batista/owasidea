[package]
name = "owasidea-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI for the Owasidea WASM app framework"
repository = "https://github.com/owasidea/owasidea"
homepage = "https://github.com/owasidea/owasidea"
categories = ["command-line-utilities", "development-tools"]
keywords = ["wasm", "wasmtime", "component-model", "plugins"]

[[bin]]
name = "owasidea"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
owasidea-host = { path = "../host" }
console = "0.15"
dialoguer = "0.11"
reqwest = { version = "0.12", features = ["json"] }
ratatui = "0.29"
crossterm = "0.28"

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true