[workspace]

[package]
name = "{{name}}"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.41"
owasidea = {{owasidea_dep}}

[package.metadata.component]
package = "poc:{{name}}"

[package.metadata.component.target]
# Generated from the #[owasidea::world]/#[owasidea::export] markers.
path = ".owasidea/wit"
world = "{{name}}"
