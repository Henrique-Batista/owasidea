[package]
name = "owasidea-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Reusable host runtime for the Owasidea WASM app framework"

[lib]
name = "owasidea_host"
path = "src/lib.rs"

[[bin]]
name = "owasidea-host"
path = "src/main.rs"

[features]
default = []
# Experimental long-call jobs + SSE progress + cancel (ADR-0005, RL-06).
# Off by default: no new routes, no job manager, and `/call` is unchanged.
streaming = []
# Optional OpenTelemetry tracing (RL-05). Off by default: no new dependencies,
# no span construction, and no OTLP exporter unless this feature is enabled and
# `OTEL_EXPORTER_OTLP_ENDPOINT` is set.
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]

[dependencies]
anyhow.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
wasmtime.workspace = true
wasmtime-wasi.workspace = true
wasmtime-wasi-http.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
bytes = "1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rustls = "0.23"
tokio-rustls = "0.26"
webpki-roots = "1"
async-stream = "0.3"
futures = "0.3"
sha2 = "0.10"
semver = "1"
ring = "0.17"

opentelemetry = { version = "0.33", optional = true, default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33", optional = true, default-features = false, features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.33", optional = true, default-features = false, features = [
    "trace",
    "http-proto",
    # The SDK's batch span processor runs on its own OS thread, so it needs the
    # blocking HTTP client; an async client panics with "no reactor running".
    "reqwest-blocking-client",
] }
tracing-opentelemetry = { version = "0.34", optional = true }

[dev-dependencies]
# `stream` powers the SSE assertions in `tests/reload_sse.rs`.
reqwest = { workspace = true, features = ["stream"] }
tokio = { workspace = true }
serde_json = { workspace = true }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
