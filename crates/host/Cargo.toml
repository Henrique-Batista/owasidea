[package]
name = "owasidea-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Reusable host runtime for the Owasidea WASM app framework"

[lib]
name = "owasidea_host"
path = "src/lib.rs"

[[bin]]
name = "owasidea-host"
path = "src/main.rs"

[features]
default = []
# Optional OpenTelemetry tracing (RL-05). Off by default: no new dependencies,
# no span construction, and no OTLP exporter unless this feature is enabled and
# `OTEL_EXPORTER_OTLP_ENDPOINT` is set.
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]

[dependencies]
anyhow.workspace = true
axum.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
wasmtime.workspace = true
wasmtime-wasi.workspace = true
wasmtime-wasi-http.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }
http = "1"
http-body-util = "0.1"
tokio-stream = "0.1"
async-stream = "0.3"
futures = "0.3"
sha2 = "0.10"
semver = "1"
ring = "0.17"
base64 = "0.22"

opentelemetry = { version = "0.33", optional = true, default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33", optional = true, default-features = false, features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.33", optional = true, default-features = false, features = [
    "trace",
    "http-proto",
    # The SDK's batch span processor runs on its own OS thread, so it needs the
    # blocking HTTP client; an async client panics with "no reactor running".
    "reqwest-blocking-client",
] }
tracing-opentelemetry = { version = "0.34", optional = true }

[dev-dependencies]
reqwest = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }