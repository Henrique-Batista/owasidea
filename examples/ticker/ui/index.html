<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ticker · Owasidea</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 520px; margin: 3rem auto; padding: 0 1rem; }
    button { padding: 0.5rem 1rem; margin-right: 0.5rem; }
    .error { color: #b00020; }
    .muted { color: #666; }
  </style>
</head>
<body>
  <h1>ticker</h1>
  <p class="muted">A stateful service: start and stop it from the UI.</p>

  <p>Status: <strong data-testid="status">unknown</strong></p>
  <button id="start" type="button">Start</button>
  <button id="stop" type="button">Stop</button>
  <button id="reload" type="button">Reload component</button>
  <p id="message" role="status"></p>

  <script type="module" src="/src/main.ts"></script>
</body>
