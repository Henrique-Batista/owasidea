[workspace]

[package]
name = "watchtower-rust"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.41"

[package.metadata.component]
package = "shipyard:watchtower"

[package.metadata.component.target]
path = "wit"
world = "watchtower"

[package.metadata.component.target.dependencies]
"poc:host" = { path = "wit/deps/host" }
