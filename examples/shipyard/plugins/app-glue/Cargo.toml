[workspace]

[package]
name = "app-glue"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.41"
serde_json = "1"

[package.metadata.component]
package = "shipyard:glue"

[package.metadata.component.target]
path = "wit"
world = "glue"

[package.metadata.component.target.dependencies]
"shipyard:core" = { path = "wit/deps/core" }
"shipyard:audit" = { path = "wit/deps/audit" }
"shipyard:changelog" = { path = "wit/deps/changelog" }
"shipyard:policy" = { path = "wit/deps/policy" }
"shipyard:fingerprint" = { path = "wit/deps/fingerprint" }
"shipyard:metrics" = { path = "wit/deps/metrics" }
"shipyard:pipeline" = { path = "wit/deps/pipeline" }
"poc:host" = { path = "wit/deps/service-control" }
