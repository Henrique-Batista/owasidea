<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>hello · Owasidea</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 520px; margin: 3rem auto; padding: 0 1rem; }
    form { display: flex; gap: 0.5rem; margin: 1rem 0; }
    input { flex: 1; padding: 0.5rem; }
    button { padding: 0.5rem 1rem; }
    output { display: block; min-height: 1.5rem; font-family: ui-monospace, monospace; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>hello</h1>
  <p>Calls the <code>greeter</code> component through the host.</p>

  <form id="greet-form">
    <input id="name" name="name" value="world" aria-label="Name" />
    <button type="submit">Greet</button>
  </form>
  <output id="greeting" data-testid="greeting"></output>

  <form id="sum-form">
    <input id="a" type="number" value="2" aria-label="First number" />
    <input id="b" type="number" value="40" aria-label="Second number" />
    <button type="submit">Sum</button>
  </form>
  <output id="total" data-testid="total"></output>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
