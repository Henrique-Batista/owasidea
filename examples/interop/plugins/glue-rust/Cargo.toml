[workspace]

[package]
name = "glue-rust"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.41"

[package.metadata.component]
package = "interop:glue"

[package.metadata.component.target]
path = "wit"
world = "glue"

[package.metadata.component.target.dependencies]
"interop:provider" = { path = "wit/deps/provider" }
"poc:host" = { path = "wit/deps/host" }
