[workspace]
resolver = "2"
members = [
    "crates/host",
    "crates/cli",
    "crates/owasidea",
]
# desktop added later (Tauri)
default-members = ["crates/host", "crates/cli", "crates/owasidea"]
exclude = ["plugins/*"]

[workspace.package]
version = "1.3.0"
edition = "2021"
license = "MIT"
authors = ["Owasidea"]

[profile.dev]
# Line tables keep useful backtraces without paying full debuginfo + link cost.
debug = 1

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = "0.3"
wasmtime = { version = "50", features = ["cache"] }
wasmtime-wasi = "50"
wasmtime-wasi-http = "50"
assert_cmd = "2"
predicates = "3"
