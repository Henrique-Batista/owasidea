# CI policy (B0.2):
# - Fast job runs on every PR and push.
# - Full matrix (build+smoke+Playwright+bundle) runs only on push to
#   release/1.0 and tags, at most 2x per day to avoid burning CI quota.
# - No cron schedules are defined; avoid unbounded matrix runs.
# - Third-party actions are referenced by major tag (`@v4`). Pinning every
#   action to a commit SHA is the intended hardening (G1 low); until the SHA
#   list is maintained, review tag updates and keep `permissions` minimal.
# - Steps that consume signing secrets run only on push/tag builds; PRs never
#   receive `secrets.*` and must not attempt to import certificates.
# - Build speed: sccache replaces the huge target/ Actions cache; cargo
#   registry, cargo-installed tools, Go modules and npm are cached separately.
#   Windows runs for PRs, main, release/1.0 and tags, not every feature push.

name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: "0"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  fast:
    name: Fast (fmt, clippy, tests, doctor)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Cache cargo registry/git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-reg-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-reg-

      - name: Cache cargo tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-component
            ~/.cargo/bin/cargo-component.exe
            ~/.cargo/bin/wasm-tools
            ~/.cargo/bin/wasm-tools.exe
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/bin/cargo-tauri.exe
          key: ${{ runner.os }}-cargo-tools-${{ hashFiles('tools.lock', 'Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-tools-

      - name: Install cargo-component and wasm-tools
        shell: bash
        run: |
          command -v cargo-component >/dev/null 2>&1 || cargo install cargo-component --locked
          command -v wasm-tools >/dev/null 2>&1 || cargo install wasm-tools --locked

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test host/cli
        run: cargo test --locked -p owasidea-host -p owasidea-cli

      - name: Build owasidea CLI
        run: cargo build --locked -p owasidea-cli

      - name: Put owasidea on PATH
        run: echo "$PWD/target/debug" >> "$GITHUB_PATH"

      - name: Compile scaffold templates (Rust/Go/TS, FIX-03)
        env:
          OWASIDEA_TEMPLATE_STRICT: "1"
        run: scripts/test-templates.sh

      - name: Code-signing planner checks (RL-03)
        run: scripts/test-signing-plan.sh

      - name: SBOM/provenance checks (RL-04)
        run: scripts/test-sbom.sh

      - name: owasidea doctor --json
        run: owasidea doctor --json

  full:
    name: Full (Shipyard build, smoke, Playwright, deb bundle)
    needs: fast
    if: github.event_name == 'push' && (github.ref == 'refs/heads/release/1.0' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    # Updater (RL-02): all values are optional. When the endpoint/public key
    # are set, the bundle signs updater artifacts and writes latest.json;
    # otherwise the updater steps are skipped safely. See docs/UPDATER.md.
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      OWASIDEA_UPDATER_ENDPOINT: ${{ vars.OWASIDEA_UPDATER_ENDPOINT }}
      OWASIDEA_UPDATER_PUBKEY: ${{ vars.OWASIDEA_UPDATER_PUBKEY }}
      OWASIDEA_UPDATER_BASE_URL: ${{ vars.OWASIDEA_UPDATER_BASE_URL }}
      OWASIDEA_UPDATE_CHANNEL: ${{ vars.OWASIDEA_UPDATE_CHANNEL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            examples/shipyard/ui/package-lock.json
            examples/shipyard/plugins/board-svelte/package-lock.json
            examples/shipyard/plugins/map-react/package-lock.json

      - name: Setup .NET (C# plugin)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install system deps (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev \
            librsvg2-dev patchelf libsoup-3.0-dev build-essential \
            pkg-config libssl-dev

      - name: Cache cargo registry/git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-reg-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-reg-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('examples/shipyard/playwright.config.ts') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Cache cargo tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-component
            ~/.cargo/bin/cargo-component.exe
            ~/.cargo/bin/wasm-tools
            ~/.cargo/bin/wasm-tools.exe
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/bin/cargo-tauri.exe
          key: ${{ runner.os }}-cargo-tools-${{ hashFiles('tools.lock', 'Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-tools-

      - name: Install cargo-component and wasm-tools
        shell: bash
        run: |
          command -v cargo-component >/dev/null 2>&1 || cargo install cargo-component --locked
          command -v wasm-tools >/dev/null 2>&1 || cargo install wasm-tools --locked

      - name: Install tauri-cli
        shell: bash
        run: cargo tauri --version >/dev/null 2>&1 || cargo install tauri-cli --version "^2" --locked

      - name: Build owasidea CLI
        run: cargo build --locked -p owasidea-cli

      - name: Put owasidea on PATH
        run: echo "$PWD/target/debug" >> "$GITHUB_PATH"

      # G1: the example never generates signing keys implicitly. CI creates an
      # ephemeral demo key (gitignored) and pins it for `verify`.
      - name: Generate example signing key
        working-directory: examples/shipyard
        run: |
          set -euo pipefail
          test -f keys/owasidea.key || owasidea keygen --out keys

      - name: Install optional plugin toolchains (C#/C/C++)
        run: |
          dotnet workload install wasi-experimental \
            || echo "wasi-experimental workload unavailable; the example pins the ILCompiler packages"
          owasidea doctor --install-wasi-sdk

      - name: npm ci (root Playwright)
        run: npm ci

      - name: Shipyard build
        working-directory: examples/shipyard
        run: owasidea build

      - name: Shipyard smoke
        working-directory: examples/shipyard
        run: owasidea smoke

      - name: Install Playwright Chromium
        working-directory: examples/shipyard
        run: npx playwright install --with-deps chromium

      - name: Playwright tests
        working-directory: examples/shipyard
        run: npx playwright test --config playwright.config.ts

      - name: Bundle deb and rpm
        working-directory: examples/shipyard
        run: owasidea bundle --no-build --bundles deb,rpm

      - name: Verify dist (manifests, components, signatures, UI index)
        working-directory: examples/shipyard
        run: owasidea verify dist/ --json --public-key keys/owasidea.pub

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            examples/shipyard/dist/*.deb
            examples/shipyard/dist/*.rpm
          if-no-files-found: error

      - name: SBOM and provenance (RL-04)
        working-directory: examples/shipyard
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          owasidea sbom --output dist/sbom.cdx.json --provenance --artifacts dist
          owasidea sbom --format spdx --output dist/sbom.spdx.json
          owasidea sbom --output dist/sbom.cdx.json --check

      - name: Upload SBOM and provenance
        uses: actions/upload-artifact@v4
        with:
          name: sbom-provenance
          path: |
            examples/shipyard/dist/sbom.cdx.json
            examples/shipyard/dist/sbom.spdx.json
            examples/shipyard/dist/provenance.intoto.json
          if-no-files-found: error

      - name: Verify latest.json (updater, optional)
        if: ${{ env.OWASIDEA_UPDATER_ENDPOINT != '' && env.OWASIDEA_UPDATER_PUBKEY != '' && env.TAURI_SIGNING_PRIVATE_KEY != '' }}
        working-directory: examples/shipyard
        run: owasidea latest --artifacts dist --check

      - name: Updater skipped (no key/endpoint/public key)
        if: ${{ env.OWASIDEA_UPDATER_ENDPOINT == '' || env.OWASIDEA_UPDATER_PUBKEY == '' || env.TAURI_SIGNING_PRIVATE_KEY == '' }}
        run: |
          echo "Updater artifacts and latest.json skipped: set the repository variables"
          echo "OWASIDEA_UPDATER_ENDPOINT and OWASIDEA_UPDATER_PUBKEY, and the"
          echo "TAURI_SIGNING_PRIVATE_KEY secret (see docs/UPDATER.md)."

  appimage:
    name: AppImage (optional, isolate host libs)
    needs: full
    if: github.event_name == 'push' && (github.ref == 'refs/heads/release/1.0' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup .NET (C# plugin)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install system deps (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev \
            librsvg2-dev patchelf libsoup-3.0-dev build-essential \
            pkg-config libssl-dev bubblewrap

      - name: Check AppImage prerequisites
        id: appimage
        run: |
          set -euo pipefail
          if ! command -v bwrap >/dev/null 2>&1; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "bwrap is missing; skipping AppImage (deb/rpm cover Linux)."
            exit 0
          fi
          if ! bwrap --dev-bind / / true >/dev/null 2>&1; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "bwrap cannot create a user namespace here; skipping AppImage."
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Cache cargo registry/git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-reg-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-reg-

      - name: Cache cargo tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-component
            ~/.cargo/bin/cargo-component.exe
            ~/.cargo/bin/wasm-tools
            ~/.cargo/bin/wasm-tools.exe
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/bin/cargo-tauri.exe
          key: ${{ runner.os }}-cargo-tools-${{ hashFiles('tools.lock', 'Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-tools-

      - name: Install cargo-component and wasm-tools
        shell: bash
        run: |
          command -v cargo-component >/dev/null 2>&1 || cargo install cargo-component --locked
          command -v wasm-tools >/dev/null 2>&1 || cargo install wasm-tools --locked

      - name: Install tauri-cli
        shell: bash
        run: cargo tauri --version >/dev/null 2>&1 || cargo install tauri-cli --version "^2" --locked

      - name: Build owasidea CLI
        run: cargo build --locked -p owasidea-cli

      - name: Put owasidea on PATH
        run: echo "$PWD/target/debug" >> "$GITHUB_PATH"

      - name: Generate example signing key
        working-directory: examples/shipyard
        run: |
          set -euo pipefail
          test -f keys/owasidea.key || owasidea keygen --out keys

      - name: Install optional plugin toolchains (C#/C/C++)
        if: steps.appimage.outputs.available == 'true'
        run: |
          dotnet workload install wasi-experimental \
            || echo "wasi-experimental workload unavailable; the example pins the ILCompiler packages"
          owasidea doctor --install-wasi-sdk

      - name: Shipyard build
        if: steps.appimage.outputs.available == 'true'
        working-directory: examples/shipyard
        run: owasidea build

      - name: Bundle AppImage (isolated host libs)
        if: steps.appimage.outputs.available == 'true'
        working-directory: examples/shipyard
        run: owasidea bundle --no-build --bundles appimage --isolate-host-libs

      - name: Verify dist (manifests, components, signatures, UI index)
        if: steps.appimage.outputs.available == 'true'
        working-directory: examples/shipyard
        run: owasidea verify dist/ --json --public-key keys/owasidea.pub

      - name: Upload AppImage
        if: steps.appimage.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: examples/shipyard/dist/*.AppImage
          if-no-files-found: error

      - name: AppImage skipped (bwrap unavailable)
        if: steps.appimage.outputs.available != 'true'
        run: |
          echo "AppImage was skipped: bubblewrap is unavailable or cannot"
          echo "create a user namespace. Use deb/rpm, or the clean chroot recipe"
          echo "in docs/CLEAN_BUILD.md."

  windows:
    name: Windows (host/cli, plugins, NSIS)
    runs-on: windows-latest
    # Feature pushes use Fast on Linux; Windows runs for PR parity and for
    # main/release/tag builds so platform regressions still block releases.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/1.0' || startsWith(github.ref, 'refs/tags/')
    # RL-03: non-secret signing settings. The PFX and its password are passed
    # only to the plan/import steps, and Azure credentials only to the bundle
    # step. Secrets are never printed. See docs/CODE_SIGNING.md.
    env:
      OWASIDEA_WINDOWS_CERT_THUMBPRINT: ${{ vars.OWASIDEA_WINDOWS_CERT_THUMBPRINT }}
      OWASIDEA_WINDOWS_SIGN_COMMAND: ${{ vars.OWASIDEA_WINDOWS_SIGN_COMMAND }}
      OWASIDEA_WINDOWS_DIGEST_ALGORITHM: ${{ vars.OWASIDEA_WINDOWS_DIGEST_ALGORITHM }}
      OWASIDEA_WINDOWS_TIMESTAMP_URL: ${{ vars.OWASIDEA_WINDOWS_TIMESTAMP_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Cache cargo registry/git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-reg-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-reg-

      - name: Cache cargo tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-component
            ~/.cargo/bin/cargo-component.exe
            ~/.cargo/bin/wasm-tools
            ~/.cargo/bin/wasm-tools.exe
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/bin/cargo-tauri.exe
          key: ${{ runner.os }}-cargo-tools-${{ hashFiles('tools.lock', 'Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-tools-

      - name: Install cargo-component and wasm-tools
        shell: bash
        run: |
          command -v cargo-component >/dev/null 2>&1 || cargo install cargo-component --locked
          command -v wasm-tools >/dev/null 2>&1 || cargo install wasm-tools --locked

      - name: Install tauri-cli
        shell: bash
        run: cargo tauri --version >/dev/null 2>&1 || cargo install tauri-cli --version "^2" --locked

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test host/cli
        run: cargo test --locked -p owasidea-host -p owasidea-cli

      - name: Build host and CLI
        run: cargo build --locked -p owasidea-host -p owasidea-cli

      - name: Put owasidea on PATH
        shell: bash
        run: echo "$PWD/target/debug" >> "$GITHUB_PATH"

      - name: Plan code signing (Windows, optional)
        # G1: signing secrets are only consumed on push/tag builds; PRs from
        # forks must not see them and the job must not attempt to import certs.
        if: github.event_name != 'pull_request'
        id: signing
        shell: bash
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          plan="$(owasidea signing plan --platform windows --json)"
          printf '%s\n' "$plan"
          {
            echo "mode=$(jq -r '.mode' <<<"$plan")"
            echo "sign=$(jq -r '.sign' <<<"$plan")"
            echo "import_certificate=$(jq -r '.import_certificate' <<<"$plan")"
          } >> "$GITHUB_OUTPUT"

      - name: Import Windows signing certificate (PFX)
        if: ${{ github.event_name != 'pull_request' && steps.signing.outputs.import_certificate == 'true' }}
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $pfx = Join-Path $env:RUNNER_TEMP "owasidea-codesign.pfx"
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
            $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
            "OWASIDEA_WINDOWS_CERT_THUMBPRINT=$($certificate.Thumbprint)" |
              Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host "Imported the code-signing certificate into the current-user store."
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Install Azure Artifact Signing CLI
        if: ${{ github.event_name != 'pull_request' && steps.signing.outputs.mode == 'windows-trusted-signing' && contains(env.OWASIDEA_WINDOWS_SIGN_COMMAND, 'artifact-signing-cli') }}
        run: cargo install artifact-signing-cli --locked

      - name: owasidea doctor --json (optional toolchains)
        continue-on-error: true
        run: owasidea doctor --json

      - name: Generate example signing key
        shell: bash
        working-directory: examples/shipyard
        run: |
          set -euo pipefail
          test -f keys/owasidea.key || owasidea keygen --out keys

      - name: Shipyard build (Rust/Go/TS; C#/C/C++ optional/continue-on-error)
        working-directory: examples/shipyard
        continue-on-error: true
        run: owasidea build

      - name: Bundle NSIS
        # G1: this step receives Azure signing secrets, so it runs only for
        # push/tag builds (never for pull_request).
        if: github.event_name != 'pull_request'
        working-directory: examples/shipyard
        continue-on-error: true
        env:
          # Only needed when OWASIDEA_WINDOWS_SIGN_COMMAND uses Azure Artifact
          # Signing. The PFX certificate is already in the runner store.
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: owasidea bundle --no-build --bundles nsis

      - name: Verify Authenticode signatures (optional)
        if: ${{ github.event_name != 'pull_request' && steps.signing.outputs.sign == 'true' }}
        shell: pwsh
        working-directory: examples/shipyard
        run: |
          $ErrorActionPreference = "Stop"
          $installers = @(Get-ChildItem -Path dist -Recurse -Include *.exe,*.msi -File -ErrorAction SilentlyContinue)
          if ($installers.Count -eq 0) {
            Write-Host "No Windows installers were produced; nothing to verify."
            exit 0
          }
          $invalid = @()
          foreach ($file in $installers) {
            $signature = Get-AuthenticodeSignature -FilePath $file.FullName
            Write-Host "$($file.Name): $($signature.Status)"
            if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
              $invalid += $file.FullName
            }
          }
          if ($invalid.Count -gt 0) {
            throw "Unsigned or invalid Authenticode signature: $($invalid -join ', ')"
          }

      - name: Code signing skipped (no Windows certificate)
        if: ${{ github.event_name != 'pull_request' && steps.signing.outputs.mode == 'skip' }}
        run: |
          echo "Windows installers stay unsigned: set the WINDOWS_CERTIFICATE and"
          echo "WINDOWS_CERTIFICATE_PASSWORD secrets, or OWASIDEA_WINDOWS_SIGN_COMMAND"
          echo "for Azure Artifact Signing. See docs/CODE_SIGNING.md."

      - name: Code signing skipped on pull requests
        if: github.event_name == 'pull_request'
        run: |
          echo "Signing steps are skipped on pull_request: signing secrets are"
          echo "only available to push/tag builds. See docs/CODE_SIGNING.md."

  macos:
    name: macOS (app/dmg, sign + notarize optional)
    needs: fast
    if: github.event_name == 'push' && (github.ref == 'refs/heads/release/1.0' || startsWith(github.ref, 'refs/tags/'))
    runs-on: macos-latest
    # RL-03: macOS packaging is newly wired and cannot be validated on the
    # Linux dev host; keep it out of the blocking matrix. Signing steps still
    # fail loudly when credentials are present but incomplete.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            examples/shipyard/ui/package-lock.json
            examples/shipyard/plugins/board-svelte/package-lock.json
            examples/shipyard/plugins/map-react/package-lock.json

      - name: Setup .NET (C# plugin, best effort)
        continue-on-error: true
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache cargo registry/git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-reg-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-reg-

      - name: Cache cargo tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-component
            ~/.cargo/bin/cargo-component.exe
            ~/.cargo/bin/wasm-tools
            ~/.cargo/bin/wasm-tools.exe
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/bin/cargo-tauri.exe
          key: ${{ runner.os }}-cargo-tools-${{ hashFiles('tools.lock', 'Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-tools-

      - name: Install cargo-component and wasm-tools
        shell: bash
        run: |
          command -v cargo-component >/dev/null 2>&1 || cargo install cargo-component --locked
          command -v wasm-tools >/dev/null 2>&1 || cargo install wasm-tools --locked

      - name: Install tauri-cli
        shell: bash
        run: cargo tauri --version >/dev/null 2>&1 || cargo install tauri-cli --version "^2" --locked

      - name: Build owasidea CLI
        run: cargo build --locked -p owasidea-cli

      - name: Put owasidea on PATH
        run: echo "$PWD/target/debug" >> "$GITHUB_PATH"

      - name: Install macOS plugin prerequisites (best effort)
        continue-on-error: true
        run: |
          sudo dotnet workload install wasi-experimental
          owasidea doctor --install-wasi-sdk

      - name: Generate example signing key
        working-directory: examples/shipyard
        run: |
          set -euo pipefail
          test -f keys/owasidea.key || owasidea keygen --out keys

      - name: Plan code signing (macOS, optional)
        id: signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          plan="$(owasidea signing plan --platform macos --json)"
          printf '%s\n' "$plan"
          {
            echo "mode=$(jq -r '.mode' <<<"$plan")"
            echo "sign=$(jq -r '.sign' <<<"$plan")"
            echo "notarize=$(jq -r '.notarize' <<<"$plan")"
            echo "materialize_api_key=$(jq -r '.materialize_api_key' <<<"$plan")"
          } >> "$GITHUB_OUTPUT"

      - name: Materialize App Store Connect API key (optional)
        if: ${{ steps.signing.outputs.materialize_api_key == 'true' }}
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/owasidea-AuthKey.p8"
          umask 077
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Shipyard build (Rust/Go/TS; C#/C/C++ optional)
        working-directory: examples/shipyard
        continue-on-error: true
        run: owasidea build

      - name: Bundle app and dmg (optional signing/notarization)
        working-directory: examples/shipyard
        continue-on-error: true
        env:
          # Tauri imports APPLE_CERTIFICATE into a temporary keychain, signs
          # with codesign and notarizes with notarytool (then staples).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: owasidea bundle --no-build --bundles app,dmg

      - name: Verify code signatures (optional)
        if: ${{ steps.signing.outputs.sign == 'true' }}
        working-directory: examples/shipyard
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(dist/*.app)
          if [ ${#apps[@]} -eq 0 ]; then
            echo "No .app artifacts were produced; nothing to verify."
            exit 0
          fi
          for app in "${apps[@]}"; do
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv --verbose=4 "$app" 2>&1 | grep -E "Identifier|Authority|TeamIdentifier" || true
          done

      - name: Verify notarization ticket (optional)
        if: ${{ steps.signing.outputs.notarize == 'true' }}
        working-directory: examples/shipyard
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(dist/*.app dist/*.dmg)
          if [ ${#artifacts[@]} -eq 0 ]; then
            echo "No macOS artifacts were produced; nothing to validate."
            exit 0
          fi
          for artifact in "${artifacts[@]}"; do
            xcrun stapler validate "$artifact"
          done

      - name: Code signing skipped (no Apple credentials)
        if: ${{ steps.signing.outputs.mode == 'skip' }}
        run: |
          echo "macOS artifacts stay unsigned: set APPLE_CERTIFICATE,"
          echo "APPLE_CERTIFICATE_PASSWORD and APPLE_SIGNING_IDENTITY, plus one"
          echo "notarization credential set. See docs/CODE_SIGNING.md."
